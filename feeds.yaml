# Configuration des flux RSS utilises par scripts/fetch_news.py
# Tu peux ajouter/retirer des flux ici sans toucher au code.
# "max_items" = nombre d'articles gardes par section dans le JSON final.

sebastien:
  monde:
    label: "Monde"
    max_items: 10
    feeds:
      - url: "https://www.france24.com/fr/rss"
        source: "France 24"
      - url: "https://www.rfi.fr/fr/monde/rss"
        source: "RFI"
      - url: "https://www.courrierinternational.com/feed/rubrique/une.rss"
        source: "Courrier International"
      - url: "https://www.lemonde.fr/international/rss_full.xml"
        source: "Le Monde"

  canada:
    label: "Canada"
    max_items: 10
    feeds:
      - url: "http://rss.radio-canada.ca/fils/nouvelles/national.xml"
        source: "Radio-Canada"
      - url: "http://rss.radio-canada.ca/fils/nouvelles/nouvelles.xml"
        source: "Radio-Canada (grands titres)"

  quebec:
    label: "Quebec"
    max_items: 10
    feeds:
      - url: "https://www.ledevoir.com/rss/manchettes.xml"
        source: "Le Devoir"
      - url: "https://www.journaldemontreal.com/rss.xml"
        source: "Journal de Montreal"
      - url: "https://www.lapresse.ca/manchettes/rss"
        source: "La Presse"

  france:
    label: "France"
    max_items: 10
    feeds:
      - url: "https://www.lemonde.fr/rss/une.xml"
        source: "Le Monde"
      - url: "https://www.lefigaro.fr/rss/figaro_actualites.xml"
        source: "Le Figaro"
      - url: "https://www.francetvinfo.fr/titres.rss"
        source: "France Info"
      - url: "https://www.liberation.fr/arc/outboundfeeds/rss/?outputType=xml"
        source: "Liberation"

  tech:
    label: "Veille technologique"
    max_items: 12
    feeds:
      - url: "https://www.numerama.com/feed/"
        source: "Numerama"
      - url: "https://next.ink/feed/"
        source: "Next"
      - url: "https://www.frandroid.com/feed"
        source: "Frandroid"
      - url: "https://www.clubic.com/feed/news.rss"
        source: "Clubic"

diabete:
  # Toute l'actualite diabete, francais + anglais melanges, triee par date.
  # Melange de flux dedies (medias specialises) + recherches Google News
  # (qui agregent des centaines de sources) pour maximiser le volume.
  actualites:
    label: "Actualites diabete"
    max_items: 40
    feeds:
      # --- Flux dedies diabete ---
      - url: "https://www.diabetologie-pratique.com/actualites/feed.xml"
        source: "Diabetologie Pratique"
      # (le flux "journal" de Diabetologie Pratique a ete retire : reserve
      # aux professionnels de sante avec compte, il ne renvoie plus rien
      # d'accessible publiquement)
      - url: "https://diabetesdaily.com/feed/"
        source: "Diabetes Daily"
      - url: "https://insulinnation.com/feed/"
        source: "Insulin Nation"
      - url: "https://www.sciencedaily.com/rss/health_medicine/diabetes.xml"
        source: "ScienceDaily"
      - url: "https://beyondtype1.org/feed/"
        source: "Beyond Type 1"
      - url: "https://medicalxpress.com/rss-feed/diabetes-news.html"
        source: "Medical Xpress"
      # --- Google News (agrege des centaines de medias par requete) ---
      - url: "https://news.google.com/rss/search?q=diab%C3%A8te&hl=fr&gl=FR&ceid=FR:fr"
        source: "Google News (FR)"
      - url: "https://news.google.com/rss/search?q=diab%C3%A8te&hl=fr-CA&gl=CA&ceid=CA:fr"
        source: "Google News (FR-CA)"
      - url: "https://news.google.com/rss/search?q=diabetes&hl=en-US&gl=US&ceid=US:en"
        source: "Google News (EN)"
      - url: "https://news.google.com/rss/search?q=diabetes&hl=en-GB&gl=GB&ceid=GB:en"
        source: "Google News (UK)"
      - url: "https://news.google.com/rss/search?q=diab%C3%A8te%20type%202&hl=fr&gl=FR&ceid=FR:fr"
        source: "Google News (FR - type 2)"
      - url: "https://news.google.com/rss/search?q=type%201%20diabetes&hl=en-US&gl=US&ceid=US:en"
        source: "Google News (EN - type 1)"
